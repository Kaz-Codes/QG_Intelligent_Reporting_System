<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masters — Import Status Management System</title>
<style>
  :root{
    --ink:#0F1B2D; --ink-2:#1D2C44; --slate:#5A6B84; --slate-2:#8695AB;
    --line:#D9DFE8; --line-2:#EDF0F5; --paper:#F5F7FA; --card:#FFFFFF;
    --brass:#B8873B; --brass-soft:#F5EBD8;
    --ok:#1F7A5A; --ok-soft:#E4F1EC;
    --warn:#B4531A; --warn-soft:#FBEDE2;
    --bad:#A32F2F; --bad-soft:#FAE9E9;
    --r:4px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;line-height:1.45}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

  header.topbar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:20px;
    padding:0 20px;height:52px;position:sticky;top:0;z-index:40}
  .brand{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
  .brand span{color:var(--brass)}
  .topbar nav{display:flex;gap:2px;margin-left:16px}
  .topbar nav a{color:#B9C4D4;text-decoration:none;font-size:13px;padding:6px 12px;border-radius:var(--r)}
  .topbar nav a.active{background:var(--ink-2);color:#fff}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:#B9C4D4}
  .rolepick{background:var(--ink-2);color:#fff;border:1px solid #2E4160;border-radius:var(--r);
    padding:5px 8px;font-size:12px;font-family:inherit}

  .wrap{max-width:1240px;margin:0 auto;padding:20px 20px 80px}
  .pagehead{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .pagehead h1{font-size:21px;margin:0;font-weight:600;letter-spacing:-.01em}
  .pagehead .count{font-size:12.5px;color:var(--slate)}
  .pagehead .spacer{flex:1}

  .tabs{display:flex;gap:0;border:1px solid var(--line);background:#fff;border-radius:var(--r);
    margin-bottom:14px;overflow-x:auto}
  .tab{flex:1 0 auto;min-width:120px;padding:10px 14px;border-right:1px solid var(--line);
    background:none;font:inherit;cursor:pointer;color:var(--slate);text-align:left}
  .tab:last-child{border-right:0}
  .tab .t{font-size:13px;font-weight:500;display:block;white-space:nowrap}
  .tab .c{font-size:10.5px;color:var(--slate-2);display:block;margin-top:1px}
  .tab:hover{background:#FBFCFD}
  .tab.on{background:var(--ink);color:#fff}
  .tab.on .c{color:var(--brass)}

  .toolbar{background:#fff;border:1px solid var(--line);border-radius:var(--r);
    padding:11px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input[type=search]{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);
    border-radius:var(--r);min-width:250px}
  .toolbar input:focus,.toolbar select:focus{outline:2px solid var(--brass);outline-offset:-1px}
  .chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
  .chk input{width:14px;height:14px;accent-color:var(--brass)}
  .toolbar .spacer{flex:1}

  .tablewrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
  table.m{width:100%;border-collapse:collapse}
  table.m th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);
    text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
  table.m th.num,table.m td.num{text-align:right}
  table.m td{padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:top}
  table.m tbody tr:last-child td{border-bottom:0}
  table.m tbody tr:hover{background:#FAFBFD}
  table.m tr.off td{opacity:.5}
  .nm{font-weight:500}
  .sub{display:block;font-size:11px;color:var(--slate);margin-top:1px}
  .nowrap{white-space:nowrap}

  .tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:3px;
    border:1px solid var(--line);color:var(--slate);background:#FAFBFD;white-space:nowrap}
  .tag.sea{border-color:#CBDDEE;background:#E7F0F8;color:#2C5D8F}
  .tag.air{border-color:#EBDCC0;background:var(--brass-soft);color:#8A6526}
  .tag.inactive{border-color:#E0E4EA;background:#F1F4F8;color:var(--slate-2)}
  .tag.unver{border-color:#E8CDB6;background:var(--warn-soft);color:var(--warn);cursor:help}
  .lrow{display:flex;gap:6px;margin-bottom:6px}
  .lrow:last-child{margin-bottom:0}
  .lrm{border:1px solid var(--line);background:#fff;color:var(--slate);border-radius:var(--r);
    width:30px;flex-shrink:0;cursor:pointer;font-size:15px;line-height:1;font-family:inherit}
  .lrm:hover{border-color:#D98B8B;color:#B03A3A}
  .addmore{border:1px dashed var(--line);background:#fff;color:var(--slate);border-radius:var(--r);
    padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;margin-top:6px}
  .addmore:hover{border-color:var(--brass);color:var(--brass)}
  .tag.used{cursor:help}

  .rowact{border:1px solid var(--line);background:#fff;border-radius:var(--r);
    padding:4px 9px;font-size:11.5px;cursor:pointer;color:var(--ink-2);font-family:inherit}
  .rowact:hover:not(:disabled){border-color:var(--slate)}
  .rowact:disabled{opacity:.4;cursor:not-allowed}
  .rowact.warn:hover:not(:disabled){border-color:#D98B8B;color:#B03A3A}

  .foot{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);
    background:#FBFCFD;font-size:12.5px;color:var(--slate)}
  .empty{padding:40px 20px;text-align:center;color:var(--slate)}
  .empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:600}

  .btn{font:inherit;font-size:13px;padding:7px 14px;border-radius:var(--r);cursor:pointer;
    border:1px solid transparent}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-primary:hover{background:var(--ink-2)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink-2)}
  .btn-ghost:hover{border-color:var(--slate)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  /* ---------- drawer ---------- */
  .scrim{position:fixed;inset:0;background:rgba(15,27,45,.4);z-index:50}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;
    z-index:51;display:flex;flex-direction:column;box-shadow:-2px 0 16px rgba(15,27,45,.15)}
  .drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .drawer header h3{margin:0;font-size:15px;font-weight:600}
  .drawer header .x{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:var(--r);
    width:28px;height:28px;cursor:pointer;font-size:16px;line-height:1;color:var(--slate);font-family:inherit}
  .drawer .dbody{padding:16px 18px;overflow-y:auto;flex:1}
  .drawer footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;
    background:#FBFCFD}
  .drawer footer .spacer{flex:1}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .f{display:flex;flex-direction:column;gap:5px;min-width:0}
  .f.w2{grid-column:span 2}
  label{font-size:12px;font-weight:500;color:var(--ink-2)}
  label .req{color:var(--brass);margin-left:2px}
  .hint{font-size:11px;color:var(--slate)}
  .drawer input,.drawer select{font:inherit;font-size:13.5px;padding:7px 9px;
    border:1px solid var(--line);border-radius:var(--r);width:100%;background:#fff;color:var(--ink)}
  .drawer input:focus,.drawer select:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:var(--brass)}
  .usednote{margin-top:14px;padding:10px 12px;border-left:3px solid var(--brass);
    background:var(--brass-soft);border-radius:0 var(--r) var(--r) 0;font-size:12px;color:#7A5B22}
  [hidden]{display:none !important}

  @media(max-width:700px){
    .fgrid{grid-template-columns:1fr}
    .f.w2{grid-column:span 1}
    .toolbar input[type=search]{min-width:0;width:100%}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">Imports<span>·</span>ISMS</div>
  <nav>
    <a href="#">Dashboard</a>
    <a href="../consignments/consignment_list.html">Consignments</a>
    <a href="#">Reports</a>
    <a href="masters.html" class="active">Masters</a>
  </nav>
  <div class="right">
    <span>Viewing as</span>
    <select class="rolepick" id="role">
      <option value="admin">Admin</option>
      <option value="manager" selected>Manager</option>
      <option value="entry">Entry Operator</option>
      <option value="viewer">Viewer</option>
    </select>
  </div>
</header>

<div class="wrap">

  <div class="pagehead">
    <h1>Masters</h1>
    <span class="count" id="headCount"></span>
    <span class="spacer"></span>
    <button class="btn btn-primary" id="btnAdd">Add record</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search…" autocomplete="off">
    <label class="chk"><input type="checkbox" id="showInactive"> Show inactive</label>
    <span class="spacer"></span>
    <span class="hint" id="scopeNote"></span>
  </div>

  <div class="tablewrap">
    <table class="m">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="foot"><span id="showing"></span></div>
  </div>

</div>

<!-- ---------- add / edit drawer ---------- -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <header>
    <h3 id="dTitle">Add record</h3>
    <button class="x" id="dClose" title="Close">×</button>
  </header>
  <div class="dbody">
    <div class="fgrid" id="dFields"></div>
    <div class="usednote" id="dUsed" hidden></div>
  </div>
  <footer>
    <button class="btn btn-ghost" id="dDeactivate" hidden>Deactivate</button>
    <span class="spacer"></span>
    <button class="btn btn-ghost" id="dCancel">Cancel</button>
    <button class="btn btn-primary" id="dSave">Save</button>
  </footer>
</aside>

<script>
(function(){
  "use strict";

  /* Each master defines its own fields once. The table, the drawer form and the
     search all read from this — adding a column is a one-line change. */
  var MASTERS = {

      label:"Suppliers", noun:"supplier",

        {id:4,name:"Qadbros Engineering",code:"QBE",city:"Sheikhupura",address:"Sheikhupura Road, Km 18",active:true,used:8}
      ]
    },

    works: {
      label:"Works", noun:"works",
      fields:[
        {k:"name", t:"Name", type:"text", req:true, col:true, w:2},
        {k:"code", t:"Code", type:"text", req:true, col:true, mono:true},
        {k:"ntn",  t:"NTN / STRN", type:"text", col:true, mono:true},
        {k:"note", t:"Note", type:"text", col:false, w:2}
      ],
      rows:[
        {id:1,name:"Qadcast",code:"QCS",ntn:"1234567-8",note:"Primary importing entity",active:true,used:19},
        {id:2,name:"Qadri Brothers Unit 2",code:"QBU2",ntn:"2345678-9",note:"",active:true,used:12},
        {id:3,name:"Qadri Engineering",code:"QENG",ntn:"3456789-0",note:"EFS registered",active:true,used:10},
        {id:4,name:"Qadbros Engineering",code:"QBE",ntn:"4567890-1",note:"",active:true,used:7}
      ]
    },

    port: {
      label:"Ports", noun:"port",
      fields:[
        {k:"name",    t:"Name",    type:"text",   req:true, col:true, w:2},
        {k:"country", t:"Country", type:"text",   req:true, col:true},
        {k:"type",    t:"Type",    type:"select", req:true, col:true, opts:["Sea","Air"]},
        {k:"locode",  t:"UN/LOCODE", type:"text", col:true, mono:true},
        {k:"role",    t:"Used as", type:"select", col:true, opts:["Loading","Delivery","Both"]}
      ],
      rows:[
        {id:1,name:"Shanghai",country:"China",type:"Sea",locode:"CNSHA",role:"Loading",active:true,used:12},
        {id:2,name:"Ningbo",country:"China",type:"Sea",locode:"CNNGB",role:"Loading",active:true,used:5},
        {id:3,name:"Hamburg",country:"Germany",type:"Sea",locode:"DEHAM",role:"Loading",active:true,used:6},
        {id:4,name:"Karachi (KICT)",country:"Pakistan",type:"Sea",locode:"PKKHI",role:"Delivery",active:true,used:24},
        {id:5,name:"Port Qasim",country:"Pakistan",type:"Sea",locode:"PKBQM",role:"Delivery",active:true,used:9},

        {id:7,name:"Lahore (Allama Iqbal)",country:"Pakistan",type:"Air",locode:"PKLHE",role:"Delivery",active:true,used:4},
        {id:8,name:"Frankfurt",country:"Germany",type:"Air",locode:"DEFRA",role:"Loading",active:true,used:2}
      ]
    },

    agent: {
      label:"Clearing agents", noun:"clearing agent",
      fields:[
        {k:"name",    t:"Name",         type:"text", req:true, col:true, w:2},
        {k:"licence", t:"Licence no.",  type:"text", col:true, mono:true},
        {k:"contact", t:"Contact",      type:"text", col:true},
        {k:"phone",   t:"Phone",        type:"text", col:true},
        {k:"port",    t:"Primary port", type:"select", col:true,
         opts:["Karachi (KICT)","Port Qasim","Lahore (Allama Iqbal)"]}
      ],
      rows:[
        {id:1,name:"Prime Cargo Services",licence:"CHA-04412",contact:"S. Ahmed",phone:"+92 21 3456 7890",port:"Karachi (KICT)",active:true,used:14},
        {id:2,name:"Indus Clearing Co.",licence:"CHA-02218",contact:"R. Bhatti",phone:"+92 21 3277 1180",port:"Port Qasim",active:true,used:8},
        {id:3,name:"Sea Link Logistics",licence:"CHA-05901",contact:"F. Malik",phone:"+92 21 3499 2020",port:"Karachi (KICT)",active:true,used:5},
        {id:4,name:"Al-Noor Clearing Agency",licence:"CHA-01107",contact:"—",phone:"+92 42 3588 4411",port:"Lahore (Allama Iqbal)",active:false,used:2}
      ]
    },

    item: {
      label:"Items", noun:"item",
      fields:[
        {k:"code",     t:"Item code",       type:"text",   req:true, col:true, mono:true},
        {k:"name",     t:"Item name",       type:"text",   req:true, col:true, w:2},

         hint:"A starting value — can be changed per consignment"},

         hint:"An item may classify differently by variant or origin"},
        {k:"category", t:"Category",        type:"combo",  col:true,
         hint:"Pick an existing one or type a new category"}
      ],
      rows:[
        {id:1,code:"BRG-6205",name:"Ball bearing 6205-2RS",spec:"Deep groove, C3 clearance, steel cage",uom:"Pcs",hs:["8482.10.00"],category:"Bearings",active:true,verified:true,used:11},
        {id:2,code:"SEL-3552",name:"Oil seal TC 35x52x7",spec:"NBR, double lip, spring loaded",uom:"Pcs",hs:["4016.93.00","4016.99.00"],category:"Seals & gaskets",active:true,verified:true,used:7},
        {id:3,code:"PLC-1515",name:"PLC S7-1500 CPU",spec:"CPU 1515-2 PN",uom:"Pcs",hs:["8537.10.00"],category:"Electrical & control",active:true,verified:true,used:4},
        {id:4,code:"VBT-SPB2000",name:"V-belt SPB 2000",spec:"Wrapped, narrow section",uom:"Pcs",hs:["4010.32.00"],category:"Power transmission",active:true,verified:true,used:6},
        {id:5,code:"HYD-VLV4WRE",name:"Proportional valve 4WRE",spec:"NG10, 24V DC",uom:"Pcs",hs:["8481.20.00","8481.80.00"],category:"Hydraulics",active:true,verified:true,used:3},
        {id:6,code:"STL-RB80",name:"Alloy steel round bar 80mm",spec:"EN19, hardened & tempered",uom:"Kg",hs:["7228.30.00"],category:"Raw material",active:true,verified:true,used:2},
        {id:7,code:"GSK-CU14",name:"Copper washer 14mm",spec:"",uom:"Pcs",hs:[],category:"Seals & gaskets",active:true,verified:false,used:1}
      ]
    }
  };

  var ORDER = ["supplier","branch","works","port","agent","item"];
  var current = "supplier";
  var editing = null;   /* row being edited, or null when adding */

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }
  function role(){ return document.getElementById("role").value; }
  function canEdit(){ return ["admin","manager"].indexOf(role()) > -1; }

  /* ---------- tabs ---------- */
  function drawTabs(){
    document.getElementById("tabs").innerHTML = ORDER.map(function(k){
      var m = MASTERS[k];
      var n = m.rows.filter(function(r){ return r.active; }).length;
      return '<button type="button" class="tab'+(k===current?" on":"")+'" data-k="'+k+'">'+
        '<span class="t">'+m.label+'</span><span class="c">'+n+' active</span></button>';
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
      b.onclick = function(){
        current = b.dataset.k;
        document.getElementById("q").value = "";
        draw();
      };
    });
  }

  /* ---------- table ---------- */
  function visibleRows(){
    var m = MASTERS[current];
    var q = document.getElementById("q").value.trim().toLowerCase();
    var inc = document.getElementById("showInactive").checked;
    return m.rows.filter(function(r){
      if(!inc && !r.active) return false;
      if(!q) return true;
      return m.fields.some(function(f){
        var v = r[f.k];
        if(Array.isArray(v)) return v.join(" ").toLowerCase().indexOf(q) > -1;
        return String(v || "").toLowerCase().indexOf(q) > -1;
      });
    });
  }

  function draw(){
    drawTabs();
    var m = MASTERS[current];
    var cols = m.fields.filter(function(f){ return f.col; });

    document.getElementById("q").placeholder = "Search " + m.label.toLowerCase() + "…";
    document.getElementById("btnAdd").textContent = "Add " + m.noun;
    document.getElementById("btnAdd").disabled = !canEdit();
    var needs = m.rows.filter(function(r){ return r.verified === false && r.active; }).length;
    document.getElementById("scopeNote").innerHTML = needs
      ? '<span class="tag unver">'+needs+' need'+(needs===1?"s":"")+' review</span> ' +
        'Created during data entry — open each to confirm the details'
      : "Deactivating keeps the record visible in past consignments and reports";

    document.getElementById("thead").innerHTML = "<tr>" +
      cols.map(function(f){ return "<th>"+esc(f.t)+"</th>"; }).join("") +
      '<th class="num">Used in</th><th></th></tr>';

    var rows = visibleRows();
    var tb = document.getElementById("tbody");

    if(!rows.length){
      tb.innerHTML = '<tr><td colspan="'+(cols.length+2)+'"><div class="empty">'+
        '<b>Nothing matches</b>Clear the search or add a new '+esc(m.noun)+'.</div></td></tr>';
    }else{
      tb.innerHTML = rows.map(function(r){
        var cells = cols.map(function(f, i){
          var v = r[f.k];
          var out;
          if(Array.isArray(v)){
            out = v.length
              ? '<span class="mono">'+esc(v[0])+'</span>' +
                (v.length > 1 ? ' <span class="tag" title="'+esc(v.join(", "))+'">+'+(v.length-1)+'</span>' : "")
              : '<span style="color:var(--slate-2)">—</span>';
          }else if(f.k === "type"){
            out = '<span class="tag '+String(v).toLowerCase()+'">'+esc(v)+'</span>';
          }else if(!v || v === "—"){
            out = '<span style="color:var(--slate-2)">—</span>';
          }else{
            out = esc(v);
          }
          if(i === 0){
            out = '<span class="nm'+(f.mono?" mono":"")+'">'+out+'</span>' +
                  (r.active ? "" : ' <span class="tag inactive">Inactive</span>') +
                  (r.verified === false
                    ? ' <span class="tag unver" title="Created during data entry — open and save to confirm the details">Needs review</span>'
                    : "");
          }else if(f.mono && !Array.isArray(v)){
            out = '<span class="mono">'+out+'</span>';
          }
          return "<td>"+out+"</td>";
        }).join("");

        return '<tr class="'+(r.active?"":"off")+'" data-id="'+r.id+'">'+cells+
          '<td class="num"><span class="tag used" title="Referenced by '+r.used+
            ' consignment'+(r.used===1?"":"s")+'">'+r.used+'</span></td>'+
          '<td class="nowrap"><button type="button" class="rowact" data-act="edit"'+
            (canEdit()?"":" disabled")+'>Edit</button> '+
            '<button type="button" class="rowact warn" data-act="toggle"'+
            (canEdit()?"":" disabled")+'>'+(r.active?"Deactivate":"Reactivate")+'</button></td>'+
        '</tr>';
      }).join("");
    }

    var total = m.rows.length;
    document.getElementById("showing").textContent =
      rows.length + " of " + total + " " + m.label.toLowerCase() + " shown";
    document.getElementById("headCount").textContent =
      ORDER.reduce(function(s,k){ return s + MASTERS[k].rows.length; }, 0) + " records across 6 lists";

    Array.prototype.forEach.call(tb.querySelectorAll(".rowact"), function(b){
      b.onclick = function(){
        var id = +b.closest("tr").dataset.id;
        var row = MASTERS[current].rows.filter(function(r){ return r.id === id; })[0];
        if(b.dataset.act === "edit") openDrawer(row);
        else { row.active = !row.active; draw(); }
      };
    });
  }

  /* ---------- repeating list field ---------- */
  function listRow(f, v){
    return '<div class="lrow"><input name="'+f.k+'[]" value="'+esc(v)+'" autocomplete="off"'+
      (f.mono?' class="mono"':'')+' placeholder="'+(f.k==="hs"?"0000.00.00":"")+'">'+
      '<button type="button" class="lrm" title="Remove">×</button></div>';
  }
  function wireListRows(){
    Array.prototype.forEach.call(document.querySelectorAll("#dFields .lrm"), function(b){
      b.onclick = function(){
        var wrap = b.closest(".listwrap");
        if(wrap.querySelectorAll(".lrow").length === 1){
          wrap.querySelector("input").value = "";
        }else{
          b.closest(".lrow").remove();
        }
      };
    });
  }

  /* ---------- drawer ---------- */
  function openDrawer(row){
    editing = row || null;
    var m = MASTERS[current];
    document.getElementById("dTitle").textContent =
      (row ? "Edit " : "Add ") + m.noun;

    document.getElementById("dFields").innerHTML = m.fields.map(function(f){
      var v = row ? (row[f.k] == null ? "" : row[f.k]) : "";
      var input;
      if(f.type === "select"){
        input = '<select name="'+f.k+'"><option value="">Select…</option>' +
          f.opts.map(function(o){
            return '<option'+(String(v)===o?" selected":"")+'>'+esc(o)+'</option>';
          }).join("") + '</select>';
      }else if(f.type === "combo"){
        /* existing values become suggestions, but anything can be typed */
        var seen = m.rows.map(function(r){ return r[f.k]; })
                    .filter(function(x,i,a){ return x && a.indexOf(x) === i; }).sort();
        input = '<input name="'+f.k+'" list="dl-'+f.k+'" value="'+esc(v)+'" autocomplete="off">' +
          '<datalist id="dl-'+f.k+'">' +
          seen.map(function(o){ return '<option>'+esc(o)+'</option>'; }).join("") + '</datalist>';
      }else if(f.type === "list"){
        var vals = Array.isArray(v) ? v : (v ? [v] : []);
        if(!vals.length) vals = [""];
        input = '<div class="listwrap" data-list="'+f.k+'">' +
          vals.map(function(x){ return listRow(f, x); }).join("") +
          '</div><button type="button" class="addmore" data-add="'+f.k+'">+ Add another</button>';
      }else{
        input = '<input name="'+f.k+'" value="'+esc(v)+'" autocomplete="off"'+
                (f.mono?' class="mono"':'')+'>';
      }
      return '<div class="f'+(f.w===2?" w2":"")+'">'+
        '<label>'+esc(f.t)+(f.req?' <span class="req">*</span>':'')+'</label>'+
        input + (f.hint ? '<span class="hint">'+esc(f.hint)+'</span>' : '') + '</div>';
    }).join("");

    /* wire the repeating list controls */
    Array.prototype.forEach.call(document.querySelectorAll("#dFields .addmore"), function(b){
      b.onclick = function(){
        var f = m.fields.filter(function(x){ return x.k === b.dataset.add; })[0];
        var wrap = document.querySelector('#dFields [data-list="'+f.k+'"]');
        wrap.insertAdjacentHTML("beforeend", listRow(f, ""));
        wireListRows();
        wrap.lastElementChild.querySelector("input").focus();
      };
    });
    wireListRows();

    var used = document.getElementById("dUsed");
    var deact = document.getElementById("dDeactivate");
    if(row){
      used.hidden = false;
      used.textContent = "Referenced by " + row.used + " consignment" +
        (row.used === 1 ? "" : "s") + ". Records are never deleted — deactivating only " +
        "hides it from new entry, so historic consignments and reports keep working.";
      deact.hidden = false;
      deact.textContent = row.active ? "Deactivate" : "Reactivate";
    }else{
      used.hidden = true;
      deact.hidden = true;
    }

    document.getElementById("scrim").hidden = false;
    document.getElementById("drawer").hidden = false;
    var first = document.querySelector("#dFields input, #dFields select");
    if(first) first.focus();
  }

  function closeDrawer(){
    document.getElementById("scrim").hidden = true;
    document.getElementById("drawer").hidden = true;
    editing = null;
  }

  function saveDrawer(){
    var m = MASTERS[current];
    var data = {};
    var missing = [];
    m.fields.forEach(function(f){
      if(f.type === "list"){
        var vals = Array.prototype.slice.call(
          document.querySelectorAll('#dFields [name="'+f.k+'[]"]'))
          .map(function(el){ return el.value.trim(); })
          .filter(function(x,i,a){ return x && a.indexOf(x) === i; });
        data[f.k] = vals;
        if(f.req && !vals.length) missing.push(f.t);
      }else{
        var el = document.querySelector('#dFields [name="'+f.k+'"]');
        data[f.k] = el ? el.value.trim() : "";
        if(f.req && !data[f.k]) missing.push(f.t);
      }
    });
    if(missing.length){
      alert("Still needed: " + missing.join(", "));
      return;
    }
    if(editing){
      m.fields.forEach(function(f){ editing[f.k] = data[f.k]; });
      /* a Manager opening and saving an inline-created record is the review step */
      if(editing.verified === false && canEdit()) editing.verified = true;
    }else{
      var nextId = m.rows.reduce(function(x,r){ return Math.max(x, r.id); }, 0) + 1;
      data.id = nextId; data.active = true; data.used = 0; data.verified = true;
      m.rows.push(data);
    }
    closeDrawer();
    draw();
  }

  document.getElementById("btnAdd").onclick = function(){ openDrawer(null); };
  document.getElementById("dClose").onclick = closeDrawer;
  document.getElementById("dCancel").onclick = closeDrawer;
  document.getElementById("scrim").onclick = closeDrawer;
  document.getElementById("dSave").onclick = saveDrawer;
  document.getElementById("dDeactivate").onclick = function(){
    if(editing){ editing.active = !editing.active; closeDrawer(); draw(); }
  };
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && !document.getElementById("drawer").hidden) closeDrawer();
  });

  document.getElementById("q").addEventListener("input", draw);
  document.getElementById("showInactive").addEventListener("change", draw);
  document.getElementById("role").addEventListener("change", draw);

  draw();
})();
</script>
</body>
</html>
